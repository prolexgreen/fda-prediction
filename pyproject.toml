[project]
name = "fda-predictor"
version = "0.1.0"
description = "Multimodal clinical-trial outcome / FDA approval prediction (three transformer streams)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Exact pin: CUDA build pulled from the pytorch-cu124 index below.
    "torch==2.6.0+cu124",
    "transformers>=4.53",
    "tokenizers>=0.21",
    "huggingface_hub>=0.30",
    "einops>=0.8",            # required by MoLFormer remote modeling code
    "rdkit>=2024.9",
    "PyTDC>=0.4",
    "scikit-learn>=1.6",
    "tensorboard>=2.19",
    "requests>=2.32",
    "pyyaml>=6.0.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=19.0",
    "datasets>=3.0",
    "yfinance>=0.2",
    "matplotlib>=3.9",
    # TDC still does `import pkg_resources`; removed from setuptools 81+
    "setuptools>=65,<81",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fda_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires locally cached TDC TOP data (auto-skips when absent)",
]
